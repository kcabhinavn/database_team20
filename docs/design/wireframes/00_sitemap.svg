<text x="44.0" y="288.0" font-size="13" fill="#495057" font-weight="400" text-anchor="start">•  Check her wallet history</text>
<text x="44.0" y="312.0" font-size="13" fill="#495057" font-weight="400" text-anchor="start">•  Read reviews of a vehicle</text>
